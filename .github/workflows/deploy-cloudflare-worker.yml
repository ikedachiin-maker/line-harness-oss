name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Run pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_NAME"

          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
            "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)"

          for f in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$f")
            applied=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote \
              --command "SELECT name FROM _migrations WHERE name = '${name}'" --json \
              | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d[0]?.results?.length||0)")
            if [ "$applied" = "0" ]; then
              echo "Applying: $name"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$f"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
                "INSERT INTO _migrations (name, applied_at) VALUES ('${name}', datetime('now'))"
            else
              echo "Skipped: $name"
            fi
          done

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'your-worker-name' }}
          # Admin CORS config — set these as repo Variables when the admin panel
          # and the Worker API are on different origins (e.g. *.pages.dev admin
          # + *.workers.dev API). Baking them into the deployed config (vars)
          # means every deploy carries them, so they can't be silently dropped
          # the way a manually-set dashboard variable is on redeploy.
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ vars.ADMIN_ALLOW_CROSS_SITE }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          # Sibling harness URLs for the audience roll-up (GET /api/audience
          # polling). Optional; each is paired with a *_HARNESS_API_KEY secret
          # set via `wrangler secret put`. Baked in here for the same reason as
          # the CORS vars: a dashboard-set var is dropped on the next deploy.
          X_HARNESS_URL: ${{ vars.X_HARNESS_URL }}
          IG_HARNESS_URL: ${{ vars.IG_HARNESS_URL }}
          THREADS_HARNESS_URL: ${{ vars.THREADS_HARNESS_URL }}
          MAIL_HARNESS_URL: ${{ vars.MAIL_HARNESS_URL }}
          # Sibling harness Worker *names* (not URLs), for when they live in the
          # SAME Cloudflare account. Cloudflare answers 404 to a subrequest from
          # one Worker to another Worker's *.workers.dev hostname, so the URL
          # above is unreachable from inside this Worker even though curl gets
          # 200. A service binding is the supported way across that gap.
          # Leave unset when the sibling is on a different account — then the
          # URL path is used and works.
          X_HARNESS_SERVICE: ${{ vars.X_HARNESS_SERVICE }}
          IG_HARNESS_SERVICE: ${{ vars.IG_HARNESS_SERVICE }}
          THREADS_HARNESS_SERVICE: ${{ vars.THREADS_HARNESS_SERVICE }}
          MAIL_HARNESS_SERVICE: ${{ vars.MAIL_HARNESS_SERVICE }}
          # A second Worker on the same channel (Threads is one-deploy-per-
          # account, so two accounts means two Workers). Numbered suffixes
          # continue as _3, _4 ... in the collector; add rows here if needed.
          THREADS_HARNESS_URL_2: ${{ vars.THREADS_HARNESS_URL_2 }}
          THREADS_HARNESS_SERVICE_2: ${{ vars.THREADS_HARNESS_SERVICE_2 }}
          X_HARNESS_URL_2: ${{ vars.X_HARNESS_URL_2 }}
          X_HARNESS_SERVICE_2: ${{ vars.X_HARNESS_SERVICE_2 }}
        run: |
          test -n "$D1_DATABASE_ID"
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json
          # Inject admin CORS vars into the deployed config when ADMIN_ORIGIN is
          # set. ADMIN_ALLOW_CROSS_SITE defaults to "true" (SameSite=None; Secure
          # cookies) since cross-origin admin/API is the case that needs it.
          if [ -n "$ADMIN_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$ADMIN_ORIGIN" --arg x "$ADMIN_ALLOW_CROSS_SITE" --arg w "$WORKER_URL" '
              .vars.ADMIN_ORIGIN = $o
              | .vars.ADMIN_ALLOW_CROSS_SITE = (if $x == "" then "true" else $x end)
              | (if $w != "" then .vars.WORKER_URL = $w else . end)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched admin CORS vars: ADMIN_ORIGIN=$ADMIN_ORIGIN ADMIN_ALLOW_CROSS_SITE=${ADMIN_ALLOW_CROSS_SITE:-true}"
          fi
          # Inject sibling harness URLs (audience roll-up) when set.
          for name in X_HARNESS_URL IG_HARNESS_URL THREADS_HARNESS_URL MAIL_HARNESS_URL THREADS_HARNESS_URL_2 X_HARNESS_URL_2; do
            val="${!name}"
            if [ -n "$val" ]; then
              tmp="$(mktemp)"
              jq --arg k "$name" --arg v "$val" '.vars[$k] = $v' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
              echo "Patched harness var: $name=$val"
            fi
          done
          # Inject service bindings for siblings in the same account. Kept out of
          # wrangler.toml on purpose: a binding naming a Worker that does not
          # exist fails the deploy, and a fork has none of these.
          for name in X_HARNESS_SERVICE IG_HARNESS_SERVICE THREADS_HARNESS_SERVICE MAIL_HARNESS_SERVICE THREADS_HARNESS_SERVICE_2 X_HARNESS_SERVICE_2; do
            val="${!name}"
            if [ -n "$val" ]; then
              tmp="$(mktemp)"
              jq --arg b "$name" --arg s "$val" '.services = ((.services // []) + [{binding: $b, service: $s}])' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
              echo "Patched service binding: $name -> $val"
            fi
          done

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME || 'your-worker-name' }}
